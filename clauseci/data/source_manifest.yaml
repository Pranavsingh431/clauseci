# Trusted source manifest.
#
# Provenance and trust metadata only. This file records what a document IS,
# never what it SAYS.
#
# It deliberately contains no retention cap, no expected obligation, no expected
# clause and no expected result. Caps are read from the document text by the
# analyzer. Putting them here would mean the analyzer graded its own answer key.
#
# Eligibility to control a current obligation is NOT stored here. It is derived
# in code from execution status, effective date and customer association. That
# keeps a judgement out of the data file.
#
# Drive file ids are environment specific, so sources are keyed by their stable
# document name. The Drive file id is bound at analysis time from the snapshot.

