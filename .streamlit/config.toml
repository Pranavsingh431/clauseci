# Appearance only.
#
# Networking is deliberately absent. Streamlit Community Cloud owns the server,
# the proxy and the websocket, and forcing server options here fights it. An
# earlier version set server.enableCORS = false alongside
# server.enableXsrfProtection = true, which Streamlit warns about on every
# start and silently overrides. Those options are gone.
#
# No secret belongs in this file, and the public deployment needs no
# .streamlit/secrets.toml at all.

[theme]
base = "dark"
primaryColor = "#5B8DEF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161A23"
textColor = "#E6E9EF"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Error details stay visible. Hiding them turns a recoverable problem into a
# page that looks blank, which is exactly what makes a demo failure unreadable.
showErrorDetails = true
