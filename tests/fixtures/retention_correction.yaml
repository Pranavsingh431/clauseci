# Preferred scoped correction for the retention pull request.
#
# This is the correction a developer applies after ClauseCI reports. It is a
# proposal fixture, not something the agent pushes on its own.
#
# It keeps the requested 90 day default and pins acme-corp back down, because
# NW-DPA-ACME-2026-A1 section 2.1 caps that tenant at 30 days for application,
# diagnostic and audit logs.
#
# acme-corp audit is written explicitly rather than inherited, so a future
# change to defaults cannot silently raise it.

defaults:
  application_logs_days: 90
  diagnostic_logs_days: 90
  audit_logs_days: 30
  backup_retention_days: 7

customers:
  acme-corp:
    display_name: "Acme Corporation"
    # Pinned by NW-DPA-ACME-2026-A1 section 2.1. Do not raise without an
    # executed amendment.
    application_logs_days: 30
    diagnostic_logs_days: 30
    audit_logs_days: 30
    backup_retention_days: 7

  globex:
    display_name: "Globex International Ltd."
    # application and diagnostic inherit the new 90 day default, which is
    # within the 90 day cap in NW-DPA-GLOBEX-2026-0302 section 1.1.
    audit_logs_days: 365
    backup_retention_days: 30

  acme-labs:
    display_name: "Acme Labs Pvt Ltd"
    # application and diagnostic inherit 90, within the 180 day cap in
    # NW-MSA-ACMELABS-2026-0611 section 2.1.
    audit_logs_days: 180
    backup_retention_days: 30
